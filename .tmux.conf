set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'   # true color + italics passthrough
# NOTE: do not override Ms here. tmux calls it with two parameters (clipboard
# flags + base64 data); a format that references only %p2 makes ncurses tparm
# fail ("could not expand Ms") and tmux then sends nothing at all, silently
# breaking every copy. The stock 'clipboard' terminal-feature already supplies
# the correct Ms=\E]52;%p1%s;%p2%s\007. It is enabled by default for client
# TERMs matching xterm*, XTerm, mintty, iTerm2 and tmux; other client TERMs get
# it from the terminal-features line below.
set -as terminal-features 'alacritty*:clipboard'   # client TERM=alacritty has no default Ms
set-option -sg escape-time 10
set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

# enable undercurls
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"
#reload conf
bind r source-file ~/.tmux.conf \; display-message "Reloading config"
# basic
set -g base-index 1
set -g pane-base-index 1
set -g pane-active-border fg=magenta
set -ag pane-active-border bg=black

# mouse, copy and clip
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
set-option -g allow-passthrough on
# Server option: a fresh tmux 3.5a server defaults to 'external', and
# 'external' drops application OSC 52 entirely (tmux parses the sequence and
# returns without storing a buffer or forwarding it) - which is why nvim's
# clipboard traffic vanished. 'on' lets tmux keep its paste buffers in sync
# with pane OSC 52 and answer queries from panes. Same behavior everywhere
# (ssh, bare metal, WSL2): the option lives on the server, not the client.
set -g set-clipboard on

# OSC 52 clipboard integration (works over ssh, bare metal and WSL2 alike)
# Copy: ~/.local/bin/tmux-osc52 prefers wl-copy/xclip when a display exists
#       (bare metal, WSLg), otherwise writes OSC 52 to the tmux client tty so
#       it reaches the outer terminal through ssh. Copy-mode and nvim both
#       funnel through it / the same tty.
# Paste: use the terminal's paste key (Ctrl+Shift+V / Shift+Insert) or tmux's
#       paste buffer; bracketed paste needs no clipboard provider.
# OSC 52 *read* (a '? ' query) is not reliable anywhere: mosh 1.4 forwards
# only the write direction, Alacritty denies reads by default
# (terminal.osc52 = "OnlyCopy") and Windows Terminal never answers them.

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52"
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52"
# vim-like pane switching
bind -r ^ last-window
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R

bind -n M-up select-pane -U
bind -n M-down select-pane -D
bind -n M-left select-pane -L
bind -n M-right select-pane -R

bind -n M-K resize-pane -U 1
bind -n M-J resize-pane -D 1
bind -n M-H resize-pane -L 1
bind -n M-L resize-pane -R 1

bind -n M-S-up resize-pane -U 1
bind -n M-S-down resize-pane -D 1
bind -n M-S-left resize-pane -L 1
bind -n M-S-right resize-pane -R 1

# More friendly split pane
bind-key h split-window -h
bind-key v split-window -v

#status
# set -g status off
# toggle status bar (prefix + S)
# Note: status is a server option in tmux 3.x; -g only changes the global
# default and does NOT affect the live status line.
bind-key S set-option -s status
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" #H %H:%M %d-%b-%y"

# window titles
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"

# plugin manager + which-key-style menu
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'alexwforsythe/tmux-which-key'
#
# run '~/.tmux/plugins/tpm/tpm'

# Use MacPorts bash 5.x on macOS, system bash everywhere else
if-shell '[ "$(uname -s)" = "Darwin" ] && [ -x /opt/local/bin/bash ]' \
    'set -g default-shell /opt/local/bin/bash' \
    'set -g default-shell /bin/bash'
